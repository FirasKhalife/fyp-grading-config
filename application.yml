# Shared by every Assay service (the config server serves this file to all applications).
# Each service's own application.yml is complete on its own; this file only holds settings that must be the same
# everywhere. Values here override the services' defaults, so it must never widen what is exposed.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # never '*': heapdump, env and shutdown stay closed
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Which tokens the services accept (review: issuer and audience). The keys are still fetched from the internal
# Keycloak address (each service's jwk-set-uri, AUTH_SERVER_URL); setting both means no discovery call goes out.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer in the tokens: Keycloak's public URL (KC_HOSTNAME) + /realms/assay. Compose sets it from
          # PUBLIC_URL; the default is the dev compose's Keycloak.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:7080/realms/assay}

assay:
  security:
    # The clients whose tokens are accepted (the azp claim): only the single-page app.
    authorized-parties: assay-spa

logging:
  level:
    root: INFO
    org.springframework.cloud.config: WARN
